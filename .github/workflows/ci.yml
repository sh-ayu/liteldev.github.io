# Checks a pull request the way the deploy builds the site (deploy.yml, which runs on every push to main): type-check,
# lint, tests, the whole build with every docs site's link check, the kit's test sites and the link check of the
# whole site. LeviLamina's API reference (Doxygen) is made in the deploy only.
# Pull requests the discovery workflow opens (mods-discover.yml) start no workflows of their own.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history for the docs' "Last updated" dates
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # The registry cache the Pages deploy saves (see deploy.yml); read only here.
      - uses: actions/cache/restore@v6
        with:
          path: .cache/mods
          key: mods-registry-v2-${{ github.run_id }}
          restore-keys: mods-registry-v2-

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The docs engine's test sites (src/kit/demo/): MkDocs-style with suffix locales, VitePress-style with folder
      # locales, and a single-locale site; each built and link-checked.
      - run: node scripts/docs-sites.mjs build src/kit/demo src/kit/demo/lip.config.ts src/kit/demo/single.config.ts

      - run: npm run linkcheck
